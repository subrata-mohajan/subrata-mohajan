<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Subrata Mohajan, graphic designer and brand visualizer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0B1E4A"/>
      <stop offset=".62" stop-color="#103A86"/>
      <stop offset="1" stop-color="#1E88E5"/>
    </linearGradient>
    <linearGradient id="stripe" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity=".07"/>
    </linearGradient>
    <pattern id="lines" width="28" height="300" patternUnits="userSpaceOnUse">
      <rect width="14" height="300" fill="url(#stripe)"/>
    </pattern>
  </defs>
  <rect width="1200" height="300" rx="20" fill="url(#bg)"/>
  <!-- vertical stripes, echoing the profile photo background -->
  <rect x="640" width="560" height="300" rx="20" fill="url(#lines)"/>
  <g font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
    <text x="72" y="138" fill="#FFFFFF" font-size="58" font-weight="700" letter-spacing="-1">Subrata Mohajan</text>
    <text x="74" y="186" fill="#CFE8FF" font-size="26">Graphic designer &amp; brand visualizer</text>
    <text x="74" y="232" fill="#8FB8E8" font-size="18" letter-spacing="2">CHITTAGONG, BANGLADESH</text>
  </g>
  <rect x="74" y="78" width="44" height="4" rx="2" fill="#29B6F6"/>
</svg>
